name: stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/collect-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit snapshot
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@github.com"
          git add docs/assets/stats.json
          git diff --cached --quiet || git commit -m "chore(stats): daily snapshot"
          git push
