<!doctype html>
<!--
  Rocket LAN — map-credit lower-third (static overlay)
  ============================================================================
  A transparent attribution caption for custom-map gameplay clips. Same brand
  fonts/colours as the trailer text engine. Render to a transparent PNG with
  headless Chromium, e.g.:

    msedge --headless=new --window-size=1920,1080 --force-device-scale-factor=1 \
      --default-background-color=00000000 --screenshot=out.png \
      "file:///…/trailer/overlay-map-credit.html"

  To caption a different map, edit the .kicker / .title / .byline text below
  and re-render. Fonts are self-hosted in ./fonts (offline-safe).
-->
<meta charset="utf-8">
<title>Rocket LAN — map credit overlay</title>
<style>
  @font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:block;src:url("fonts/space-grotesk-500.woff2") format("woff2")}
  @font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:block;src:url("fonts/space-grotesk-600.woff2") format("woff2")}
  @font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:block;src:url("fonts/space-grotesk-700.woff2") format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:700;font-display:block;src:url("fonts/jetbrains-mono-700.woff2") format("woff2")}

  :root{
    --ink:oklch(0.96 0.004 250);            /* site --text */
    --dim:oklch(0.78 0.010 250);            /* slightly brighter than --text-muted for legibility over video */
    --accent:oklch(0.82 0.13 205);          /* site --accent (cyan) */
    --accent-soft:oklch(0.82 0.13 205 / 0.55);
    --body:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    /* Stacked dark shadow so text reads on any gameplay background without a box. */
    --legible:0 2px 10px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.9);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:var(--body)}

  /* Lower-third anchored bottom-left, mirroring the trailer's scene-3 label. */
  .lower3{position:absolute;left:96px;bottom:96px;display:flex;align-items:stretch;gap:30px}
  .accent-bar{width:8px;border-radius:4px;background:var(--accent);box-shadow:0 0 26px var(--accent-soft);flex:none}
  .txt{display:flex;flex-direction:column;justify-content:center;gap:14px}

  .kicker{font-family:var(--mono);font-weight:700;font-size:27px;letter-spacing:4px;
    text-transform:uppercase;color:var(--accent);text-shadow:var(--legible)}
  .title{font-family:var(--body);font-weight:700;font-size:88px;line-height:.95;letter-spacing:-0.01em;
    color:var(--ink);text-shadow:var(--legible)}
  .title .x{color:var(--accent);text-shadow:0 0 30px var(--accent-soft),var(--legible)}
  .byline{font-family:var(--body);font-weight:500;font-size:40px;color:var(--dim);text-shadow:var(--legible)}
  .byline b{font-weight:700;color:var(--ink)}
</style>

<div class="lower3">
  <div class="accent-bar"></div>
  <div class="txt">
    <div class="kicker">Rocket League&nbsp;&nbsp;·&nbsp;&nbsp;Custom map</div>
    <div class="title">PORTAL<span class="x">x</span>PINBALL</div>
    <div class="byline">by <b>Fractal</b> &amp; <b>ThundaSurge</b></div>
  </div>
</div>
